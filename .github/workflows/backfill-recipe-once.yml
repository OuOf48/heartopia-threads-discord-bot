name: 食譜圖片單次補發

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/backfill-recipe-once.yml"

permissions:
  contents: write

concurrency:
  group: heartopia-threads-monitor
  cancel-in-progress: false

jobs:
  backfill-recipe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_CHANNEL_ID: ${{ vars.DISCORD_CHANNEL_ID }}
      DISCORD_UPDATE_CHANNEL_ID: ${{ vars.DISCORD_UPDATE_CHANNEL_ID }}
      DISCORD_METEOR_CHANNEL_ID: ${{ vars.DISCORD_METEOR_CHANNEL_ID }}
      THREADS_USERNAME: ${{ vars.THREADS_USERNAME }}

    steps:
      - name: 下載程式碼
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 設定 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安裝套件
        run: npm ci

      - name: 尋找系統 Chrome
        shell: bash
        run: |
          chrome_path="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [[ -z "$chrome_path" ]]; then
            npx playwright-core install chromium
            chrome_path="$(node -e "const { chromium } = require('playwright-core'); process.stdout.write(chromium.executablePath())")"
          fi
          echo "CHROME_PATH=$chrome_path" >> "$GITHUB_ENV"

      - name: 補發 8 月 25 日食譜圖片
        run: npm start -- --mode=backfill --post-id=DccOnXuH_L6 --category=recipe

      - name: 保存防重複狀態
        shell: bash
        run: |
          git add data/state.json
          if git diff --cached --quiet; then
            echo "狀態沒有變更。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: 記錄食譜補發狀態 [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
