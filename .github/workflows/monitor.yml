name: Threads 心動小鎮監測

on:
  schedule:
    # 避開整點的 GitHub Actions 高峰；UTC 17/47 分即每 30 分鐘一次。
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: 執行模式
        required: true
        default: monitor
        type: choice
        options:
          - monitor
          - dry-run
          - discord-test

permissions:
  contents: write

concurrency:
  group: heartopia-threads-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_CHANNEL_ID: ${{ vars.DISCORD_CHANNEL_ID }}
      THREADS_USERNAME: ${{ vars.THREADS_USERNAME }}
      RUN_MODE: ${{ github.event.inputs.mode || 'monitor' }}

    steps:
      - name: 下載程式碼
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 設定 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安裝套件
        run: npm ci

      - name: 尋找系統 Chrome
        shell: bash
        run: |
          chrome_path="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [[ -z "$chrome_path" ]]; then
            echo "系統沒有 Chrome，安裝 Playwright Chromium。"
            npx playwright-core install chromium
            chrome_path="$(node -e "const { chromium } = require('playwright-core'); process.stdout.write(chromium.executablePath())")"
          fi
          echo "CHROME_PATH=$chrome_path" >> "$GITHUB_ENV"

      - name: 執行單元測試
        run: npm test

      - name: 執行監測
        run: npm start -- --mode="$RUN_MODE"

      - name: 保存防重複狀態
        if: env.RUN_MODE == 'monitor'
        shell: bash
        run: |
          git add data/state.json
          if git diff --cached --quiet; then
            echo "狀態沒有變更。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: 更新 Threads 監測狀態 [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

