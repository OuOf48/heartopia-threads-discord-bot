name: Discord 連線單次測試

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/discord-test-once.yml"

permissions:
  contents: read

jobs:
  discord-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_CHANNEL_ID: ${{ vars.DISCORD_CHANNEL_ID }}
      THREADS_USERNAME: ${{ vars.THREADS_USERNAME }}

    steps:
      - name: 下載程式碼
        uses: actions/checkout@v4

      - name: 設定 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安裝套件
        run: npm ci

      - name: 傳送 Discord 測試訊息
        run: npm start -- --mode=discord-test
