name: Threads 圖片擷取整合測試

on:
  push:
    branches:
      - codex/add-media-routing

permissions:
  contents: read

jobs:
  media-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 下載程式碼
        uses: actions/checkout@v4

      - name: 設定 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安裝套件
        run: npm ci

      - name: 尋找系統 Chrome
        shell: bash
        run: |
          chrome_path="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [[ -z "$chrome_path" ]]; then
            npx playwright-core install chromium
            chrome_path="$(node -e "const { chromium } = require('playwright-core'); process.stdout.write(chromium.executablePath())")"
          fi
          echo "CHROME_PATH=$chrome_path" >> "$GITHUB_ENV"

      - name: 執行單元測試
        run: npm test

      - name: 檢查指定貼文 DOM 範圍
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from "playwright-core";

          const username = "oorainielove520oo";
          const postId = "DcN8GDyERCe";
          const browser = await chromium.launch({
            executablePath: process.env.CHROME_PATH,
            headless: true,
            args: ["--disable-dev-shm-usage", "--no-sandbox"],
          });
          try {
            const page = await browser.newPage({ viewport: { width: 1280, height: 1400 } });
            await page.goto(`https://www.threads.com/@${username}/post/${postId}`, {
              waitUntil: "domcontentloaded",
              timeout: 60_000,
            });
            await page.waitForSelector(`a[href="/@${username}/post/${postId}"]`, {
              timeout: 35_000,
            });
            await page.waitForTimeout(2_500);
            const diagnostics = await page.evaluate(({ username, postId }) => {
              const anchor = document.querySelector(`a[href="/@${username}/post/${postId}"]`);
              const rows = [];
              let element = anchor;
              for (let depth = 0; element && depth < 16; depth += 1, element = element.parentElement) {
                const images = Array.from(element.querySelectorAll("img"))
                  .map((image) => {
                    const rectangle = image.getBoundingClientRect();
                    return {
                      width: Math.round(rectangle.width),
                      height: Math.round(rectangle.height),
                      alt: image.getAttribute("alt"),
                    };
                  })
                  .filter((image) => image.width >= 160 && image.height >= 160);
                rows.push({
                  depth,
                  tag: element.tagName,
                  role: element.getAttribute("role"),
                  pressable: element.getAttribute("data-pressable-container"),
                  textLength: (element.innerText || "").trim().length,
                  imageCount: images.length,
                  images,
                });
              }
              return rows;
            }, { username, postId });
            console.log(`POST_DOM_DIAGNOSTICS=${JSON.stringify(diagnostics)}`);
          } finally {
            await browser.close();
          }
          NODE

      - name: 驗證食譜與流星雨原圖
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { classifyInformation } from "./src/information.js";
          import { downloadPostImages } from "./src/media.js";
          import { fetchThreadsPost } from "./src/threads.js";
          import { mkdir, writeFile } from "node:fs/promises";

          const probes = [
            { postId: "DccOnXuH_L6", category: "recipe" },
            { postId: "DcN8GDyERCe", category: "meteor" },
          ];

          for (const probe of probes) {
            const post = await fetchThreadsPost("oorainielove520oo", probe.postId);
            const categories = classifyInformation(post.text).map((item) => item.category);
            if (!categories.includes(probe.category)) {
              throw new Error(`${probe.postId} 未辨識為 ${probe.category}`);
            }
            const files = await downloadPostImages(post.imageUrls, post.id);
            if (files.length === 0) throw new Error(`${probe.postId} 沒有取得圖片`);
            const outputDirectory = `probe-images/${probe.postId}`;
            await mkdir(outputDirectory, { recursive: true });
            await Promise.all(
              files.map((file) => writeFile(`${outputDirectory}/${file.filename}`, file.data)),
            );
            await writeFile(
              `${outputDirectory}/urls.json`,
              JSON.stringify(post.imageUrls, null, 2),
            );
            console.log(
              JSON.stringify({
                postId: probe.postId,
                category: probe.category,
                imageCount: files.length,
                imageBytes: files.map((file) => file.data.byteLength),
              }),
            );
          }
          NODE

      - name: 保存候選圖片供檢查
        uses: actions/upload-artifact@v4
        with:
          name: threads-image-probe
          path: probe-images
