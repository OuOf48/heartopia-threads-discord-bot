name: 一次性刪除誤發舊資源

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cleanup-stale-resources-once.yml"

permissions:
  contents: read

concurrency:
  group: heartopia-threads-monitor
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      RESOURCE_CHANNEL_ID: "1519592044283170897"

    steps:
      - name: 刪除本次誤發的四則舊資源
        run: |
          node --input-type=module <<'NODE'
          const token = String(process.env.DISCORD_BOT_TOKEN || "").trim();
          const channelId = process.env.RESOURCE_CHANNEL_ID;
          const targetPostIds = new Set([
            "DcW8Tzkk8oL",
            "DcZhVqok4n4",
            "Dcetn87kz3R",
            "DchPcEsk0fe",
          ]);
          const apiOrigin = "https://discord.com/api/v10";
          const sleep = (milliseconds) => new Promise((resolve) => setTimeout(resolve, milliseconds));
          if (!token) throw new Error("缺少 DISCORD_BOT_TOKEN。");

          async function discord(path, options = {}, attempt = 1) {
            const response = await fetch(`${apiOrigin}${path}`, {
              ...options,
              headers: {
                Authorization: `Bot ${token}`,
                "User-Agent": "HeartopiaThreadsDiscordBot/1.0",
                ...(options.headers || {}),
              },
            });
            const body = response.status === 204 ? "" : await response.text();
            if (response.status === 429 && attempt < 5) {
              let retryAfter = 1;
              try {
                retryAfter = Number(JSON.parse(body).retry_after || 1);
              } catch {
                // 使用安全的預設等待秒數。
              }
              await sleep(Math.ceil(retryAfter * 1_000));
              return discord(path, options, attempt + 1);
            }
            if (!response.ok) {
              throw new Error(`Discord API ${response.status}: ${body.slice(0, 300)}`);
            }
            return body ? JSON.parse(body) : null;
          }

          const messages = await discord(`/channels/${channelId}/messages?limit=100`);
          const matches = messages.filter((message) => {
            if (!message.author?.bot) return false;
            return (message.embeds || []).some((embed) => {
              const match = String(embed.url || "").match(/\/post\/([A-Za-z0-9_-]+)/u);
              return match && targetPostIds.has(match[1]);
            });
          });

          for (const message of matches) {
            await discord(`/channels/${channelId}/messages/${message.id}`, {
              method: "DELETE",
            });
          }
          if (matches.length !== 4) {
            throw new Error(`預期刪除 4 則，實際找到 ${matches.length} 則，請人工確認。`);
          }
          console.log("已刪除本次誤發的 4 則舊資源訊息。");
          NODE
