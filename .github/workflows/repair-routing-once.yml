name: 一次性清理 Discord 錯發圖片

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/repair-routing-once.yml"

permissions:
  contents: read

concurrency:
  group: heartopia-threads-monitor
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      UPDATE_CHANNEL_ID: "1519591991950839828"
      PINK_CHANNEL_ID: "1525791309871317125"

    steps:
      - name: 保留正確版本並刪除錯發與重複訊息
        run: |
          node --input-type=module <<'NODE'
          const token = String(process.env.DISCORD_BOT_TOKEN || "").trim();
          const apiOrigin = "https://discord.com/api/v10";
          const sleep = (milliseconds) => new Promise((resolve) => setTimeout(resolve, milliseconds));

          if (!token) throw new Error("缺少 DISCORD_BOT_TOKEN。");

          async function discord(path, options = {}, attempt = 1) {
            const response = await fetch(`${apiOrigin}${path}`, {
              ...options,
              headers: {
                Authorization: `Bot ${token}`,
                "User-Agent": "HeartopiaThreadsDiscordBot/1.0",
                ...(options.headers || {}),
              },
            });
            const body = response.status === 204 ? "" : await response.text();

            if (response.status === 429 && attempt < 5) {
              let retryAfter = 1;
              try {
                retryAfter = Number(JSON.parse(body).retry_after || 1);
              } catch {
                // 使用安全的預設等待秒數。
              }
              await sleep(Math.ceil(retryAfter * 1_000));
              return discord(path, options, attempt + 1);
            }

            if (!response.ok) {
              throw new Error(`Discord API ${response.status}: ${body.slice(0, 300)}`);
            }
            return body ? JSON.parse(body) : null;
          }

          function textMatches(message, { postId, title, date }) {
            if (!message.author?.bot) return false;
            const embeds = message.embeds || [];
            const hasPostUrl = embeds.some((embed) =>
              String(embed.url || "").includes(`/post/${postId}`),
            );
            const hasTitleAndDate = embeds.some((embed) => {
              const value = String(embed.title || "");
              return value.includes(title) && value.includes(date);
            });
            return hasPostUrl || hasTitleAndDate;
          }

          async function listMessages(channelId) {
            return discord(`/channels/${channelId}/messages?limit=100`);
          }

          async function deleteMessages(channelId, messages) {
            for (const message of messages) {
              await discord(`/channels/${channelId}/messages/${message.id}`, {
                method: "DELETE",
              });
            }
          }

          function newestValid(messages, imageCount) {
            return messages
              .filter((message) => (message.attachments || []).length === imageCount)
              .sort((left, right) => (BigInt(left.id) > BigInt(right.id) ? -1 : 1))[0] || null;
          }

          const recipeTarget = {
            postId: "DccOnXuH_L6",
            title: "新食譜情報",
            date: "8月25日",
          };
          const pinkTarget = {
            postId: "DcmaVC4k1YM",
            title: "粉紅泡泡位置",
            date: "8月28日",
          };

          const updateMessages = await listMessages(process.env.UPDATE_CHANNEL_ID);
          const recipes = updateMessages.filter((message) => textMatches(message, recipeTarget));
          const keepRecipe = newestValid(recipes, 3);
          if (!keepRecipe) {
            throw new Error("更新資料頻道找不到含 3 張圖片的正確食譜訊息，停止清理。");
          }
          const oldRecipes = recipes.filter((message) => message.id !== keepRecipe.id);
          const misplacedPink = updateMessages.filter((message) =>
            textMatches(message, pinkTarget),
          );
          await deleteMessages(process.env.UPDATE_CHANNEL_ID, [
            ...oldRecipes,
            ...misplacedPink.filter(
              (message) => !oldRecipes.some((recipe) => recipe.id === message.id),
            ),
          ]);

          const pinkMessages = await listMessages(process.env.PINK_CHANNEL_ID);
          const pinkMatches = pinkMessages.filter((message) => textMatches(message, pinkTarget));
          const keepPink = newestValid(pinkMatches, 2);
          if (!keepPink) {
            throw new Error("粉紅泡泡頻道找不到含 2 張圖片的正確訊息，停止清理。");
          }
          const duplicatePink = pinkMatches.filter((message) => message.id !== keepPink.id);
          await deleteMessages(process.env.PINK_CHANNEL_ID, duplicatePink);

          console.log(
            `清理完成：刪除舊食譜 ${oldRecipes.length} 則、錯頻道粉紅泡泡 ${misplacedPink.length} 則、粉紅泡泡重複 ${duplicatePink.length} 則。`,
          );
          console.log("已保留：食譜 3 張圖片、粉紅泡泡 2 張圖片。");
          NODE
