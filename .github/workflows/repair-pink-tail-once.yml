name: 一次性重發正確粉紅泡泡地圖

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/repair-pink-tail-once.yml"

permissions:
  contents: read

concurrency:
  group: heartopia-threads-monitor
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_CHANNEL_ID: ${{ vars.DISCORD_CHANNEL_ID }}
      DISCORD_UPDATE_CHANNEL_ID: ${{ vars.DISCORD_UPDATE_CHANNEL_ID }}
      DISCORD_METEOR_CHANNEL_ID: ${{ vars.DISCORD_METEOR_CHANNEL_ID }}
      DISCORD_PINK_BUBBLE_CHANNEL_ID: ${{ vars.DISCORD_PINK_BUBBLE_CHANNEL_ID }}
      THREADS_USERNAME: ${{ vars.THREADS_USERNAME }}
      PINK_CHANNEL_ID: "1525791309871317125"

    steps:
      - name: 下載程式碼
        uses: actions/checkout@v4

      - name: 設定 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安裝套件
        run: npm ci

      - name: 尋找系統 Chrome
        shell: bash
        run: |
          chrome_path="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [[ -z "$chrome_path" ]]; then
            npx playwright-core install chromium
            chrome_path="$(node -e "const { chromium } = require('playwright-core'); process.stdout.write(chromium.executablePath())")"
          fi
          echo "CHROME_PATH=$chrome_path" >> "$GITHUB_ENV"

      - name: 確認選到輪播最後兩張
        run: |
          node --input-type=module <<'NODE'
          import { classifyInformation, selectInformationImageUrls } from "./src/information.js";
          import { fetchThreadsPost } from "./src/threads.js";

          const username = String(process.env.THREADS_USERNAME || "oorainielove520oo")
            .trim()
            .replace(/^@/u, "");
          const post = await fetchThreadsPost(username, "DcmaVC4k1YM");
          const information = classifyInformation(post.text).find(
            (item) => item.category === "pink-bubble",
          );
          if (!information) throw new Error("指定貼文未辨識為粉紅泡泡位置情報。");

          const selected = selectInformationImageUrls(post.imageUrls || [], information);
          const positions = selected.map((url) => post.imageUrls.indexOf(url) + 1);
          const expected = [post.imageUrls.length - 1, post.imageUrls.length];
          if (
            selected.length !== 2 ||
            positions[0] !== expected[0] ||
            positions[1] !== expected[1]
          ) {
            throw new Error(
              `圖片選取錯誤：共 ${post.imageUrls.length} 張，實際選到第 ${positions.join("、")} 張。`,
            );
          }
          console.log(
            `驗證成功：共抓到 ${post.imageUrls.length} 張，選取第 ${positions.join("、")} 張。`,
          );
          NODE

      - name: 補發正確粉紅泡泡位置圖
        run: npm start -- --mode=backfill --post-id=DcmaVC4k1YM --category=pink-bubble --force=true

      - name: 保留最新正確版本並刪除舊版本
        run: |
          node --input-type=module <<'NODE'
          const token = String(process.env.DISCORD_BOT_TOKEN || "").trim();
          const channelId = process.env.PINK_CHANNEL_ID;
          const apiOrigin = "https://discord.com/api/v10";
          const sleep = (milliseconds) => new Promise((resolve) => setTimeout(resolve, milliseconds));
          if (!token) throw new Error("缺少 DISCORD_BOT_TOKEN。");

          async function discord(path, options = {}, attempt = 1) {
            const response = await fetch(`${apiOrigin}${path}`, {
              ...options,
              headers: {
                Authorization: `Bot ${token}`,
                "User-Agent": "HeartopiaThreadsDiscordBot/1.0",
                ...(options.headers || {}),
              },
            });
            const body = response.status === 204 ? "" : await response.text();
            if (response.status === 429 && attempt < 5) {
              let retryAfter = 1;
              try {
                retryAfter = Number(JSON.parse(body).retry_after || 1);
              } catch {
                // 使用安全的預設等待秒數。
              }
              await sleep(Math.ceil(retryAfter * 1_000));
              return discord(path, options, attempt + 1);
            }
            if (!response.ok) {
              throw new Error(`Discord API ${response.status}: ${body.slice(0, 300)}`);
            }
            return body ? JSON.parse(body) : null;
          }

          const messages = await discord(`/channels/${channelId}/messages?limit=100`);
          const matches = messages.filter((message) => {
            if (!message.author?.bot) return false;
            return (message.embeds || []).some((embed) => {
              const url = String(embed.url || "");
              const title = String(embed.title || "");
              return (
                url.includes("/post/DcmaVC4k1YM") ||
                (title.includes("粉紅泡泡位置") && title.includes("8月28日"))
              );
            });
          });
          const valid = matches
            .filter((message) => (message.attachments || []).length === 2)
            .sort((left, right) => (BigInt(left.id) > BigInt(right.id) ? -1 : 1));
          const keep = valid[0];
          if (!keep) throw new Error("找不到剛補發的兩張圖片訊息，停止清理。");

          const outdated = matches.filter((message) => message.id !== keep.id);
          for (const message of outdated) {
            await discord(`/channels/${channelId}/messages/${message.id}`, {
              method: "DELETE",
            });
          }
          console.log(`已保留最新正確訊息，並刪除 ${outdated.length} 則舊版本。`);
          NODE
