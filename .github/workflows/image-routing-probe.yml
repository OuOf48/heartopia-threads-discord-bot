name: Threads 圖片分流精準驗證

on:
  push:
    branches:
      - codex/fix-image-routing

permissions:
  contents: read

jobs:
  image-routing-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 下載程式碼
        uses: actions/checkout@v4

      - name: 設定 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安裝套件
        run: npm ci

      - name: 尋找系統 Chrome
        shell: bash
        run: |
          chrome_path="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [[ -z "$chrome_path" ]]; then
            npx playwright-core install chromium
            chrome_path="$(node -e "const { chromium } = require('playwright-core'); process.stdout.write(chromium.executablePath())")"
          fi
          echo "CHROME_PATH=$chrome_path" >> "$GITHUB_ENV"

      - name: 執行單元測試
        run: npm test

      - name: 驗證三種圖片不混入推薦內容
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {
            classifyInformation,
            selectInformationImageUrls,
          } from "./src/information.js";
          import { downloadPostImages } from "./src/media.js";
          import { fetchThreadsPost } from "./src/threads.js";
          import { mkdir, writeFile } from "node:fs/promises";

          const probes = [
            { postId: "DccOnXuH_L6", category: "recipe", expectedImages: 3 },
            { postId: "DcmaVC4k1YM", category: "pink-bubble", expectedImages: 2 },
            { postId: "DcN8GDyERCe", category: "meteor", expectedImages: 1 },
          ];

          const failures = [];
          for (const probe of probes) {
            const post = await fetchThreadsPost("oorainielove520oo", probe.postId);
            const information = classifyInformation(post.text).find(
              (item) => item.category === probe.category,
            );
            const categories = classifyInformation(post.text).map((item) => item.category);
            if (!categories.includes(probe.category)) {
              throw new Error(`${probe.postId} 未辨識為 ${probe.category}`);
            }
            const selectedUrls = selectInformationImageUrls(post.imageUrls, information);
            const files = await downloadPostImages(selectedUrls, post.id);
            const directory = `probe-images/${post.id}`;
            await mkdir(directory, { recursive: true });
            await Promise.all(
              files.map((file) => writeFile(`${directory}/${file.filename}`, file.data)),
            );
            console.log(
              JSON.stringify({
                postId: probe.postId,
                category: probe.category,
                collectedUrls: post.imageUrls.length,
                imageCount: files.length,
              }),
            );
            if (files.length !== probe.expectedImages) {
              failures.push(
                `${probe.postId} 預期 ${probe.expectedImages} 張，實際 ${files.length} 張`,
              );
            }
          }
          if (failures.length > 0) throw new Error(failures.join("；"));
          NODE

      - name: 保存候選圖片供檢查
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: precise-image-routing-probe
          path: probe-images
